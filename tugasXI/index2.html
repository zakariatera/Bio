<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Akun</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-gray-100">
    
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-gray-800">Selamat Datang</h1>
      <p class="text-sm text-gray-500">Masukkan email dan kata sandi Anda</p>
    </header>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
      
      <div>
        <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">Alamat Email</label>
        <input 
          type="email" 
          id="loginEmail" 
          required 
          placeholder="nama@gmail.com"
          class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500 outline-none transition"
        />
      </div>

      <div>
        <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
        <div class="relative group">
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="••••••••"
            class="w-full pl-4 pr-12 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500 outline-none transition"
          />
          <button 
            type="button" 
            onclick="toggleLoginPassword()"
            aria-label="Tampilkan atau sembunyikan kata sandi"
            class="absolute inset-y-0 right-0 px-4 flex items-center text-gray-400 group-hover:text-indigo-500 transition"
          >
            <svg id="eyeOpen" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="eyeClosed" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.024 10.024 0 014.138-4.138m6.262 6.262A3 3 0 1114.373 14.373" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.873 9.873A3 3 0 1114.127 14.127M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <p id="loginError" class="text-xs text-red-500 hidden" role="alert">Email atau kata sandi tidak cocok!</p>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200 ease-in-out mt-2"
      >
        Masuk
      </button>
    </form>

    <footer class="mt-4">
      <p class="text-center text-sm text-gray-600">
        Belum memiliki akun? 
        <a href="register.html" class="font-semibold text-indigo-600 hover:underline">Daftar di sini</a>
      </p>
    </footer>

  </main>

  <script>
    function toggleLoginPassword() {
      const input = document.getElementById('loginPassword');
      const openIcon = document.getElementById('eyeOpen');
      const closedIcon = document.getElementById('eyeClosed');

      if (input.type === 'password') {
        input.type = 'text';
        closedIcon.classList.add('hidden');
        openIcon.classList.remove('hidden');
      } else {
        input.type = 'password';
        openIcon.classList.add('hidden');
        closedIcon.classList.remove('hidden');
      }
    }

    // PROSES VERIFIKASI AKUN
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const loginError = document.getElementById('loginError');

      const storedUserData = localStorage.getItem('registeredUser');

      if (storedUserData) {
        const user = JSON.parse(storedUserData);

        if (user.email === email && user.password === password) {
          loginError.classList.add('hidden');
          alert(`Selamat datang kembali, ${user.name}! Login berhasil.`);
        } else {
          loginError.innerText = 'Email atau kata sandi salah!';
          loginError.classList.remove('hidden');
        }
      } else {
        loginError.innerText = 'Belum ada akun terdaftar. Silakan mendaftar dahulu.';
        loginError.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
