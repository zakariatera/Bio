<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body{
    margin:0;
    background:#222;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:Arial;
}

canvas{
    background:black;
}

.controls{
    margin-top:20px;
    display:grid;
    grid-template-columns:60px 60px 60px;
    gap:8px;
}

button{
    height:55px;
    font-size:24px;
    border:none;
    border-radius:10px;
    background:#444;
    color:white;
}

button:active{
    background:#666;
}
</style>
</head>

<body>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
    <div></div>
    <button onclick="setDir('up')">⬆</button>
    <div></div>

    <button onclick="setDir('left')">⬅</button>
    <button onclick="setDir('down')">⬇</button>
    <button onclick="setDir('right')">➡</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
const total = 20;

let snake = [{x:10,y:10}];
let food = randomFood();

let dx = 1;
let dy = 0;
let score = 0;

function randomFood(){
    return {
        x: Math.floor(Math.random()*total),
        y: Math.floor(Math.random()*total)
    };
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") setDir("up");
    if(e.key==="ArrowDown") setDir("down");
    if(e.key==="ArrowLeft") setDir("left");
    if(e.key==="ArrowRight") setDir("right");
});

function setDir(dir){
    if(dir==="up" && dy===0){dx=0;dy=-1;}
    if(dir==="down" && dy===0){dx=0;dy=1;}
    if(dir==="left" && dx===0){dx=-1;dy=0;}
    if(dir==="right" && dx===0){dx=1;dy=0;}
}

function draw(){
    ctx.clearRect(0,0,400,400);

    // makanan
    ctx.fillStyle="red";
    ctx.fillRect(food.x*box, food.y*box, box-2, box-2);

    // kepala baru
    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // tembus dinding
    if(head.x<0) head.x=19;
    if(head.x>19) head.x=0;
    if(head.y<0) head.y=19;
    if(head.y>19) head.y=0;

    // tabrak badan
    for(let s of snake){
        if(head.x===s.x && head.y===s.y){
            alert("Game Over! Skor: "+score);
            location.reload();
        }
    }

    snake.unshift(head);

    // makan
    if(head.x===food.x && head.y===food.y){
        score++;
        food=randomFood();
    }else{
        snake.pop();
    }

    // ular
    ctx.fillStyle="lime";
    for(let s of snake){
        ctx.fillRect(s.x*box, s.y*box, box-2, box-2);
    }

    // skor
    ctx.fillStyle="white";
    ctx.font="18px Arial";
    ctx.fillText("Skor: "+score,10,20);
}

setInterval(draw,120);
</script>

</body>
</html>
