<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Smooth</title>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial;
    overflow: hidden;
}

.container {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
}

.video-box {
    height: 100vh;
    position: relative;
    scroll-snap-align: start;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* TEXT */
.overlay {
    position: absolute;
    bottom: 20px;
    left: 15px;
    color: white;
}

/* MENU KANAN */
.menu {
    position: absolute;
    right: 15px;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu button {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.2);
    color: white;
}

/* BUTTON */
.upload-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #ff0050;
    color: white;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    cursor: pointer;
}

.upload-panel {
    position: fixed;
    bottom: 90px;
    right: 20px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    display: none;
    z-index: 999;
}

input, button {
    margin: 5px 0;
    padding: 6px;
    width: 180px;
}
</style>
</head>

<body>

<div class="container" id="container"></div>

<div class="upload-toggle" onclick="toggleUpload()">+</div>

<div class="upload-panel" id="panel">
    <input type="file" id="file" accept="video/*"><br>
    <input type="text" id="title" placeholder="Judul"><br>
    <input type="text" id="desc" placeholder="Deskripsi"><br>
    <button onclick="uploadVideo()">Upload</button>
</div>

<script>
const container = document.getElementById("container");

/* TOGGLE PANEL */
function toggleUpload() {
    const panel = document.getElementById("panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
}

/* UPLOAD VIDEO */
function uploadVideo() {
    const file = document.getElementById("file").files[0];
    const title = document.getElementById("title").value;
    const desc = document.getElementById("desc").value;

    if (!file) return alert("Pilih video!");

    const url = URL.createObjectURL(file);

    const div = document.createElement("div");
    div.className = "video-box";

    div.innerHTML = `
        <video src="${url}" loop playsinline muted></video>

        <div class="menu">
            <button onclick="editVideo(this)">✏️</button>
            <button onclick="deleteVideo(this)">🗑️</button>
        </div>

        <div class="overlay">
            <div class="title"><b>${title || "Tanpa Judul"}</b></div>
            <div class="desc">${desc || ""}</div>
        </div>
    `;

    container.prepend(div);
    setupVideos();
}

/* EDIT */
function editVideo(btn) {
    const box = btn.closest(".video-box");
    const titleEl = box.querySelector(".title");
    const descEl = box.querySelector(".desc");

    const newTitle = prompt("Edit Judul:", titleEl.innerText);
    const newDesc = prompt("Edit Deskripsi:", descEl.innerText);

    if (newTitle !== null) titleEl.innerHTML = "<b>" + newTitle + "</b>";
    if (newDesc !== null) descEl.innerText = newDesc;
}

/* DELETE */
function deleteVideo(btn) {
    const box = btn.closest(".video-box");

    if (confirm("Hapus video ini?")) {
        box.style.transition = "0.3s";
        box.style.opacity = "0";
        setTimeout(() => box.remove(), 300);
    }
}

/* SETUP VIDEO */
function setupVideos() {
    const videos = document.querySelectorAll("video");

    videos.forEach(video => {
        video.onclick = () => {
            if (video.muted) {
                video.muted = false;
                video.volume = 1;
                video.play();
            } else if (!video.paused) {
                video.pause();
            } else {
                video.play();
            }
        };
    });

    autoPlay();
}

/* AUTO PLAY */
function autoPlay() {
    const videos = document.querySelectorAll("video");

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            const vid = entry.target;

            if (entry.isIntersecting) {
                vid.muted = true;
                vid.play().catch(()=>{});
            } else {
                vid.pause();
            }
        });
    }, { threshold: 0.75 });

    videos.forEach(v => observer.observe(v));
}

/* SWIPE */
let startY = 0;

container.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
});

container.addEventListener("touchend", e => {
    let endY = e.changedTouches[0].clientY;
    let diff = startY - endY;

    if (Math.abs(diff) > 50) {
        const current = Math.round(container.scrollTop / window.innerHeight);

        container.scrollTo({
            top: (current + (diff > 0 ? 1 : -1)) * window.innerHeight,
            behavior: "smooth"
        });
    }
});
</script>

</body>
</html>
